<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aquatic Debris Risk Assessment</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0b1120] text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 font-sans">

    <div class="max-w-2xl w-full bg-[#111827] rounded-2xl shadow-2xl p-8 border border-slate-800">
        <!-- Header -->
        <h1 class="text-3xl font-bold text-center mb-2 text-cyan-400">🌊 Aquatic Debris Detector</h1>
        <p class="text-center text-slate-400 mb-8 text-sm">Upload an image to process through the YOLO pipeline.</p>

        <!-- Upload Form -->
        <form id="uploadForm" class="space-y-6">
            <div class="flex items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-slate-700 border-dashed rounded-xl cursor-pointer bg-[#1f2937] hover:bg-slate-700/50 transition duration-300">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6">
                        <svg class="w-10 h-10 mb-3 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
                        <p class="text-sm text-slate-300"><span class="font-semibold text-cyan-400">Click to browse</span> or drag image here</p>
                    </div>
                    <input id="fileInput" type="file" class="hidden" accept="image/*" required />
                </label>
            </div>

            <!-- Image Preview (Optional nice-to-have) -->
            <p id="fileNameDisplay" class="text-center text-sm text-cyan-300 hidden"></p>

            <button type="submit" class="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold text-lg py-3 px-4 rounded-xl transition duration-300 shadow-[0_0_15px_rgba(6,182,212,0.4)] hover:shadow-[0_0_25px_rgba(6,182,212,0.6)]">
                Run Inference & Detect
            </button>
        </form>

        <!-- Loading Indicator -->
        <div id="loading" class="hidden text-center mt-8">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-4 border-cyan-500 border-t-transparent"></div>
            <p class="text-slate-400 text-sm mt-3 animate-pulse">Processing image through YOLO model...</p>
        </div>

        <!-- Results Display -->
        <div id="results" class="hidden mt-8 space-y-6 border-t border-slate-800 pt-8">
            <!-- Text Stats -->
            <div class="bg-[#0b1120] p-5 rounded-xl border border-slate-800 shadow-inner">
                <p class="text-slate-300 text-sm"><span class="text-slate-500 uppercase tracking-wider font-semibold text-xs mr-2">Risk Assessment:</span> <span id="riskScore" class="font-bold text-lg text-white"></span></p>
                <p class="mt-2 text-slate-300 text-sm"><span class="text-slate-500 uppercase tracking-wider font-semibold text-xs mr-2">Summary:</span> <span id="summaryText" class="text-white"></span></p>
            </div>
            
            <!-- Output Image -->
            <div>
                <h3 class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-3">Annotated Output:</h3>
                <div class="bg-[#0b1120] p-2 rounded-xl border border-slate-800">
                    <img id="outputImage" src="" alt="YOLO Detections" class="rounded-lg w-full object-contain max-h-[500px]" />
                </div>
            </div>
        </div>
    </div>

    <!-- Frontend Logic -->
    <script>
        // Update file name display when a file is selected
        document.getElementById('fileInput').addEventListener('change', function(e) {
            const fileNameDisplay = document.getElementById('fileNameDisplay');
            if (this.files && this.files.length > 0) {
                fileNameDisplay.textContent = 'Selected: ' + this.files[0].name;
                fileNameDisplay.classList.remove('hidden');
            }
        });

        // Handle the form submission
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('fileInput');
            if (fileInput.files.length === 0) return;

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            // Show loading, hide results
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('results').classList.add('hidden');

            try {
                // Since Spring Boot is serving this via WebConfig, we can use the relative path!
                const response = await fetch('/api/analyze-upload', {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) throw new Error('Failed to analyze image (Server error)');

                const data = await response.json();

                // Populate UI
                const riskElement = document.getElementById('riskScore');
                riskElement.innerText = data.overallRiskScore;
                
                // Optional: Color code the risk score text
                if(data.overallRiskScore === "HIGH") {
                    riskElement.className = "font-bold text-lg text-red-500";
                } else if(data.overallRiskScore === "MEDIUM") {
                    riskElement.className = "font-bold text-lg text-yellow-500";
                } else {
                    riskElement.className = "font-bold text-lg text-green-500";
                }

                document.getElementById('summaryText').innerText = data.analysisSummary;
                document.getElementById('outputImage').src = data.annotatedImageUrl;

                // Show results
                document.getElementById('results').classList.remove('hidden');
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                // Hide loading
                document.getElementById('loading').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
